{% extends "layout.html" %}

{% block body %}
<div class="row justify-content-center mt-5">
    <h1>感謝を綴ろう。</h1>
</div>
<form action="{{url_for('post', userid=session['userid'])}}" method="post">
    <div class="form-group row justify-content-center pt-3">
        <label for="inputPostMessage" class="col-sm-2 col-form-label">氏名</label>
        <div class="col-sm-6">
            {% if session['postMessage'] %}
              <input name="postMessage" type="text" placeholder="Your Name" value="{{session['postMessage']}}" class="form-control" id="inputPostMessage" required>
            {% else %}
              <input name="postMessage" type="text" placeholder="Your Name" class="form-control" id="inputPostMessage" required>
            {% endif %}
        </div>
    </div>
    <div class="form-group row justify-content-center pt-2">
        <label class="col-form-label col-sm-2 pt-0">性別</label>
        <div class="col-sm-6">
            <div class="form-check">
                <select class="form-control" name="postAge">
                    <option value="0">~10</option>
                    <option value="1">11~20</option>
                    <option value="2">21~30</option>
                    <option value="3">31~40</option>
                    <option value="4">41~50</option>
                    <option value="5">51~60</option>
                    <option value="6">61~70</option>
                    <option value="7">71~80</option>
                    <option value="8">81~90</option>
                    <option value="9">91~100</option>
                    <option value="10">100~</option>
                </select>
            </div>
        </div>
    </div>
    <div class="form-group row justify-content-center pt-2">
        <label class="col-form-label col-sm-2 pt-0">性別</label>
        <div class="col-sm-6">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="postGender" id="postGenderMale" value="Male"  required>
                <label class="form-check-label" for="postGenderMale">
                Male
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="postGender" id="postGenderFemale" value="Female"  required>
                <label class="form-check-label" for="postGenderFemale">
                Female
                </label>
            </div>
        </div>
    </div>
    <div class="row justify-content-center pt-3">
        <button type="submit" class="btn btn-primary">投稿</button>
    </div>
</form>
<div class="row text-center mt-4">
    <div class="col">
        <a href="{{url_for('top')}}">トップページへ</a>
    </div>
</div>
{% endblock %}
