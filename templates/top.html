{% extends "layout.html" %}

{% block body %}
    <div class="text-center">
        <div class="row mt-5">
            <div class="col">
                <h1>Hello . Welcome to Flask App.</h1>
                <h5>Thanks for you!!</h5>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col">
                <h5>Developed by Sho Sappinai</h5>
            </div>
        </div>
        {% if not session['userid'] %}
            <div class="row mt-5">
                <div class="col-12">
                    <h6>新規登録</h6>
                </div>
                <div class="col-12">
                    <a href="{{url_for('register')}}">新規登録はここから可能です。</a>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <h6>ログイン</h6>
                </div>
                <div class="col-12">
                    <a href="{{url_for('login')}}">ログインはここからすることができます。</a>
                </div>
            </div>
        {% endif %}
    </div>
{% endblock %}
